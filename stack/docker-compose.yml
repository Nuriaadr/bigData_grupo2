services:
  python-app:
    build: .
    container_name: python-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - mongo
      - redis
    volumes:
      - ./app:/app
 
    mongo:
      image: mongo:7
      container_name: mongo
      restart: unless-stopped
      ports:
        - "27017:27017"
      environment:
        MONGO_INITDB_ROOT_USERNAME: root
        MONGO_INITDB_ROOT_PASSWORD: example
      volumes:
        - mongo_data:/data/db

    redis:
      image: redis:7
      container_name: redis
      restart: unless-stopped
      ports:
        - "6379:6379"
      volumes:
        - redis_data:/data

volumes:
  mongo_data:
  redis_data: